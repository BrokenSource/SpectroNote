[project]
name        = "spectronote"
description = "🎧 Piano-perfect audio spectrogram"
authors     = [{name="Tremeschin"}]
version     = "0.10.0"
readme      = "readme.md"
license     = "AGPL-3.0"
requires-python = ">=3.10"
dependencies = [
    "attrs",
    "cyclopts",
    "dearlog",
    "shaderflow",
]

[project.scripts]
spectronote = "spectronote.__main__:main"
spectro     = "spectronote.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
